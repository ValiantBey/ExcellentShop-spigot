name: Build ExcellentShop

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --no-transfer-progress

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExcellentShop
          path: |
            **/target/*.jar
            !**/target/original-*.jar
