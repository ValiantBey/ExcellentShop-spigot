name: Build ExcellentShop

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B clean package --no-transfer-progress

      - name: Upload ExcellentShop
        uses: actions/upload-artifact@v4
        with:
          name: ExcellentShop
          path: Core/target/*.jar
          if-no-files-found: error
